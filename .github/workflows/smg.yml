name: SMG pre-close digest

on:
  schedule:
    # 19:15 UTC on weekdays = 3:15pm ET during EDT, 2:15pm ET during EST.
    # Either way it lands before the 4pm close, which is the only deadline
    # that matters: SMG fills at that day's close if entered before 4pm.
    - cron: '15 19 * * 1-5'
    # 21:30 UTC = 5:30pm ET: after the close, so stops are checked against a
    # settled price rather than an intraday wobble that would alert and then
    # recover.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Signal strategy'
        type: choice
        default: insider_big
        options: [insider_big, insider, insider_senior, insider_cluster,
                  congress, congress_big, senate, watchlist]
      positions:
        description: 'Portfolio split (equal weight)'
        type: string
        default: '10'
      send:
        description: 'Push to phone/Discord'
        type: boolean
        default: true

concurrency:
  group: smg
  cancel-in-progress: false

permissions:
  contents: write        # the paper-trading log is committed daily

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt

      # The trade store is gitignored (~30MB of derived data), so the digest
      # rebuilds the recent slice it needs rather than relying on a committed
      # snapshot that would go stale.
      - name: Refresh recent filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/backfill.py --no-house --no-senate --form4-days 5 --limit 600

      # Forward paper trading: the only out-of-sample evidence in the project.
      # Backtests are in-sample, exclude delisted names, and had their
      # parameters chosen after the fact. This commits to a pick before the
      # outcome exists.
      - name: Record paper trades
        run: |
          for s in insider_big insider_cluster congress; do
            python scripts/paper.py --strategy "$s" --positions 10 --hold 63 || true
          done

      - name: Commit paper log
        run: |
          if [[ -z "$(git status --porcelain data/paper/)" ]]; then
            echo "no paper changes"; exit 0
          fi
          git config user.name  "investor-tracker[bot]"
          git config user.email "actions@github.com"
          git add data/paper/
          git commit -m "paper: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      # Stops are watched for you: remembering to check ten levels every
      # afternoon for thirteen weeks is exactly what people stop doing.
      - name: Watch stops
        if: ${{ github.event_name == 'schedule' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/stop_watch.py --send || true

      - name: Send digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/smg_digest.py \
            --strategy "${{ inputs.strategy || 'insider_big' }}" \
            --positions "${{ inputs.positions || 10 }}" \
            ${{ (inputs.send == false) && ' ' || '--send' }}
