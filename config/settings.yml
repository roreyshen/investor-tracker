# ── Alert thresholds ────────────────────────────────────────────────────────
filters:
  # Minimum dollar value for an open-market insider BUY by someone NOT on the
  # watchlist. Tune this after the first dry-run day (see README).
  min_insider_buy_usd: 1_000_000

  # A CEO or CFO buying is a materially stronger signal than a VP doing the
  # same (Lakonishok & Lee 2002; Cohen, Malloy & Pomorski 2012 on opportunistic
  # vs routine trades), so senior officers clear a lower bar.
  min_senior_buy_usd: 250_000
  senior_titles: [CEO, "Chief Executive", CFO, "Chief Financial", President,
                  Chairman, "Chief Operating", COO]

  # Minimum dollar value for an open-market insider SELL by a non-watchlist
  # person. Sells are weaker signal than buys, so this is set higher.
  min_insider_sell_usd: 10_000_000

  # Form 144 is a notice of INTENT to sell, filed at or before the order --
  # earlier than Form 4, which reports a sale afterwards. Lower bar than the
  # Form 4 sell threshold because it is a leading indicator, though it is only
  # an intent: the sale can shrink or never happen.
  min_form144_usd: 5_000_000

  # Congressional filings disclose a BAND ("$1,001 - $15,000"), never an exact
  # figure, so this compares against the bottom of the band. Set low because
  # the whole Congress files only ~1,000 transactions a year -- the volume
  # problem that drives the insider thresholds simply doesn't exist here.
  min_congress_usd: 50_000

  # Transaction codes that count as real conviction trades.
  #   P = open-market purchase (insider spent their own money) -- strongest signal
  #   S = open-market sale
  # Everything else is compensation mechanics, not conviction:
  #   A = grant/award      F = shares withheld for taxes
  #   M = option exercise  G = gift        C = conversion
  signal_codes: [P, S]

  # Cluster buy: N+ distinct insiders at the same company buying inside a window.
  # Fires regardless of dollar size -- historically the strongest insider signal.
  cluster_min_insiders: 3
  cluster_window_days: 7

  # Anyone on the watchlist alerts on EVERY trade, ignoring the thresholds above.

# ── Notification channels ───────────────────────────────────────────────────
notify:
  discord:
    enabled: true              # primary channel: free + reliable
  ntfy:
    # Free push to your phone, sent from GitHub Actions -- so it arrives even
    # when the Mac is closed or offline, which the Mac agent cannot do.
    # The topic is a shared secret and this repo is public, so it lives in the
    # NTFY_TOPIC GitHub secret, never here.
    enabled: true

  mac_agent:
    # Queues alerts to state/outbox.json for the Mac to text via Messages.app.
    # The carrier email-to-SMS route was scrapped: Xfinity Mobile bounces it and
    # Verizon retires the gateway 2027-03-31. See mac_agent/README.md.
    enabled: true
  twilio:
    # Paid fallback, kept ready but off. Only worth it if the Mac agent proves
    # too unreliable (it only sends while the Mac is awake).
    enabled: false
    from_number: ""
    to_number: "+14087486507"

# ── Source toggles ──────────────────────────────────────────────────────────
sources:
  edgar_form4: true            # ~2 business day lag  (THE fast one)
  house:       true            # 30-45 day statutory lag
  senate:      true            # 30-45 day statutory lag
  edgar_13f:   true            # quarterly, up to 4.5 months stale
  edgar_form144: true          # proposed insider sales, filed BEFORE the sale

http:
  # SEC requires a declared User-Agent with real contact info. They ban IPs that
  # omit it. Rate limit is 10 req/s; we stay at 5 to be polite.
  user_agent: "Rorey Shen roreyshen@gmail.com"
  requests_per_second: 8
  timeout_seconds: 30
  max_retries: 3
